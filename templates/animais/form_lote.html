{% extends "base.html" %}
{% block title %}Novo Lote{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white"><h5 class="mb-0 fw-bold">Novo Lote</h5></div>
      <div class="card-body">
        <form method="post">{% csrf_token %}
          {% for field in form %}
          <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div class="text-danger small">{{ field.errors.0 }}</div>{% endif %}
          </div>
          {% endfor %}
          <div class="d-flex gap-2 justify-content-end">
            <a href="{% url 'animais:lista_lotes' %}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-success">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
