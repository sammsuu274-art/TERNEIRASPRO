{% extends 'base.html' %}

{% block title %}Meu Perfil{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="card-title mb-4">
                        <i class="bi bi-person-circle me-2"></i>
                        Meu Perfil
                    </h2>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nome de usuário:</label>
                        <p class="form-control-plaintext">{{ user.username }}</p>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nome completo:</label>
                        <p class="form-control-plaintext">{{ user.nome_completo|default:"Não informado" }}</p>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Email:</label>
                        <p class="form-control-plaintext">{{ user.email|default:"Não informado" }}</p>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Telefone:</label>
                        <p class="form-control-plaintext">{{ user.telefone|default:"Não informado" }}</p>
                    </div>
                    
                    <hr>
                    
                    <div class="d-flex gap-2">
                        <a href="/" class="btn btn-secondary">
                            <i class="bi bi-arrow-left me-2"></i>
                            Voltar ao Dashboard
                        </a>
                        <a href="{% url 'accounts:logout' %}" class="btn btn-outline-danger">
                            <i class="bi bi-box-arrow-right me-2"></i>
                            Sair
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
