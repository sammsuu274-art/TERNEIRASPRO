{% extends 'base.html' %}
{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row">
    <div class="col-lg-8 mx-auto">
      <div class="card shadow-sm">
        <div class="card-header bg-secondary text-white">
          <h4 class="mb-0"><i class="bi bi-file-text-fill me-2"></i>{{ titulo }}</h4>
        </div>
        <div class="card-body">
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">Data do Consentimento</label>
              {{ form.data_consentimento }}
            </div>
            <div class="mb-3">
              <label class="form-label">Consentimento</label>
              {{ form.consentimento_dado }}
            </div>
            <div class="mb-3">
              <label class="form-label">Produtores</label>
              <div class="border rounded p-2">{{ form.produtores }}</div>
            </div>
            <div class="mb-3">
              <label class="form-label">Observações</label>
              {{ form.observacoes }}
            </div>
            {{ form.propriedade.as_hidden }}
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-secondary">
                <i class="bi bi-check-lg me-1"></i>Salvar
              </button>
              <a href="{% url 'bem_estar_animal:lista_consentimentos' %}" class="btn btn-outline-secondary">
                <i class="bi bi-x-lg me-1"></i>Cancelar
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
